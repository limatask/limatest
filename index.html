<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CBT Portal - SMPN 5 Tangerang (Limatask)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header-app">
    <h1>SMPN 5 TANGERANG</h1>
    <p>Portal Ujian CBT Online Mobile-First</p>
  </header>

  <div id="stickyTimer" class="sticky-timer hidden">
    <div>
      <span id="displayNama" style="font-size:0.9rem;">Siswa</span>
      <div id="violateBadge" class="warning-badge">Pelanggaran: 0/5</div>
    </div>
    <div class="timer-badge" id="timerCount">00:00</div>
  </div>

  <div class="container">
    
    <!-- STEP 1: MAPEL -->
    <div id="stepMapel" class="card">
      <h3>Pilih Mata Pelajaran</h3>
      <br>
      <div class="grid-2" id="listMapel"></div>
    </div>

    <!-- STEP 2: KELAS -->
    <div id="stepKelas" class="card hidden">
      <button class="btn btn-secondary" onclick="app.navBack('stepMapel')">← Kembali</button>
      <br>
      <h3>Pilih Kelas</h3>
      <br>
      <div class="grid-3">
        <button class="btn" onclick="app.selectKelas('7')">Kelas 7</button>
        <button class="btn" onclick="app.selectKelas('8')">Kelas 8</button>
        <button class="btn" onclick="app.selectKelas('9')">Kelas 9</button>
      </div>
    </div>

    <!-- STEP 3: BAB -->
    <div id="stepBab" class="card hidden">
      <button class="btn btn-secondary" onclick="app.navBack('stepKelas')">← Kembali</button>
      <br>
      <h3>Pilih Bab / Materi Ujian</h3>
      <br>
      <div id="listBab"></div>
    </div>

    <!-- STEP 4: FORM SISWA -->
    <div id="stepFormSiswa" class="card hidden">
      <button class="btn btn-secondary" onclick="app.navBack('stepBab')">← Kembali</button>
      <br>
      <h3>Formulir Peserta Ujian</h3>
      <br>
      <form id="formSiswa" onsubmit="app.startExam(event)">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="siswaNama" class="form-control" required placeholder="Contoh: Ahmad Rizky">
        </div>
        <div class="form-group">
          <label>NISN (10 Digit)</label>
          <input type="number" id="siswaNisn" class="form-control" required placeholder="0012345678" pattern="\d{10}">
        </div>
        <div class="form-group">
          <label>Rombel / Kelas</label>
          <input type="text" id="siswaRombel" class="form-control" required placeholder="Contoh: 7-A">
        </div>
        <div class="form-group">
          <label>Token Ujian</label>
          <input type="text" id="siswaToken" class="form-control" style="text-transform:uppercase" required placeholder="Masukkan Token Guru">
        </div>
        <button type="submit" class="btn btn-success">Mulai Kuis (Fullscreen)</button>
      </form>
    </div>

    <!-- STEP 5: LAYAR KUIS -->
    <div id="stepKuis" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <span id="soalNumber" style="font-weight:bold;">Soal 1 dari 40</span>
        </div>
        <div id="soalText" class="soal-text">Loading soal...</div>
        <div id="optionsContainer"></div>
      </div>

      <div class="card grid-2">
        <button class="btn btn-secondary" id="btnPrev" onclick="app.prevSoal()">← Sebelumnya</button>
        <button class="btn" id="btnNext" onclick="app.nextSoal()">Berikutnya →</button>
      </div>

      <div class="card">
        <button class="btn btn-danger" onclick="app.confirmSubmit()">Selesaikan & Kirim Jawaban</button>
        <div id="gridNavSoal" class="nav-soal-grid"></div>
      </div>
    </div>

  </div>

  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
